[project]
name = "llm-pruning"
version = "0.1.0"
description = "Experimental framework for LLM organization, causal interventions and specialist compression."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "transformers",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]
